<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mesa de Coordinación Administrativa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f3f4f7;--panel:#fff;--ink:#18213a;--muted:#5b6479;--line:#dde1ea;--navy:#1d2c55;--accent:#a8741a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10141f;--panel:#171d2b;--ink:#e6e9f2;--muted:#9aa3b8;--line:#2a3246;--navy:#0b1124;--accent:#e0a94a;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;padding:16px}
.box{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.top{background:var(--navy);color:#fff;padding:20px 24px}
.top b{font-family:"Libre Franklin",system-ui,sans-serif;font-weight:800;font-size:18px;display:block}
.top span{font-size:12.5px;opacity:.75}
form{padding:22px 24px;display:grid;gap:12px}
label{font-size:13px;font-weight:600;color:var(--muted);display:grid;gap:6px}
input[type=password],input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.show{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:400}
button{font:600 15px "Source Sans 3",system-ui,sans-serif;background:var(--navy);color:#fff;border:0;border-radius:7px;padding:11px;cursor:pointer}
@media (prefers-color-scheme:dark){button{background:var(--accent);color:#1a1405}}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em;margin:0}
.foot{font-size:12px;color:var(--muted);padding:0 24px 18px}
</style>
</head>
<body>
<div class="box">
  <div class="top"><b>Coordinación Administrativa</b><span>Dirección Seccional de Administración Judicial · Sincelejo</span></div>
  <form id="f" autocomplete="off">
    <label for="pw">Clave de acceso<input id="pw" type="password" required autofocus></label>
    <label class="show" for="sh"><input id="sh" type="checkbox"> Mostrar clave</label>
    <button id="go" type="submit">Ingresar</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <div class="foot">Contenido cifrado. Solo se abre con la clave correcta.</div>
</div>
